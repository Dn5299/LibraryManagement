<h1>Quản lý sách</h1>

<div class="search-section">

    <input
        class="search"
        type="text"
        placeholder="Tìm kiếm sách..."
        [ngModel]="searchText()"
        (ngModelChange)="searchText.set($event)"
    >

    <button
        class="add-book"
        (click)="openAddForm()"
    >
        + Thêm sách
    </button>

</div>

<br>

<app-book-table
  [books]="filteredBooks()"
  (edit)="editBook($event)"
  (delete)="deleteBook($event)">
</app-book-table>


<app-book-form
  [visible]="showAddForm()"
  [selectedBook]="selectedBook()"

  [title]="newTitle"
  [author]="newAuthor"
  [category]="newCategory"
  [year]="newYear"
  [quantity]="newQuantity"
  [status]="newStatus"

  (titleChange)="newTitle = $event"
  (authorChange)="newAuthor = $event"
  (categoryChange)="newCategory = $event"
  (yearChange)="newYear = $event"
  (quantityChange)="newQuantity = $event"
  (statusChange)="newStatus = $event"

  (save)="saveBook()"
  (close)="closeForm()">
</app-book-form>
