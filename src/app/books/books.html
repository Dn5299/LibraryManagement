<h1>Quản lý sách</h1>

<div class="search-section">

    <input
    class="search"
    type="text"
    placeholder="Tìm kiếm sách..."
    (input)="searchText$.next($any($event.target).value)"
    >

    <button
        class="add-book"
        (click)="openAddForm()"
    >
        + Thêm sách
    </button>

</div>

<br>

<app-book-table
    [books]="filteredBooks()"
    (edit)="editBook($event)"
    (delete)="deleteBook($event)">
</app-book-table>

<app-book-form
    [visible]="showAddForm()"
    [selectedBook]="selectedBook()"
    [form]="bookForm"
    (save)="saveBook()"
    (close)="closeForm()">
</app-book-form>
