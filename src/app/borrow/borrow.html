<h1>Mượn/Trả</h1>

<div class="search-section">

    <input
        class="search"
        [ngModel]="searchText()"
        (ngModelChange)="searchText.set($event)"
        placeholder="Tìm kiếm tên độc giả"
    >

    <button
        class="add-book"
        (click)="openAddForm()"
    >
        + Phiếu mượn
    </button>

</div>

<br>

<app-borrow-table
    [borrow]="filteredBorrow()"
    (edit)="editBorrow($event)"
    (delete)="deleteBorrow($event)">
</app-borrow-table>

<app-borrow-form
    [visible]="showAddForm()"
    [selectedBorrow]="selectedBorrow()"

    [readers]="newReaders"
    (readersChange)="newReaders = $event"

    [citizenId]="newCitizenId"
    (citizenIdChange)="newCitizenId = $event"

    [title]="newTitle"
    (titleChange)="newTitle = $event; calculateFee()"

    [quantityBorrow]="newQuantityBorrow"
    (quantityBorrowChange)="newQuantityBorrow = $event; calculateFee()"

    [borrowd]="newBorrowd"
    (borrowdChange)="newBorrowd = $event"

    [returnd]="newReturnd"
    (returndChange)="newReturnd = $event"

    [note]="newNote"
    (noteChange)="newNote = $event"

    [unitPrice]="unitPrice"
    [borrowFee]="borrowFee"
    [lateFee]="lateFee"
    [totalFee]="totalFee"

    (save)="saveBorrow()"
    (close)="showAddForm.set(false)">
</app-borrow-form>
